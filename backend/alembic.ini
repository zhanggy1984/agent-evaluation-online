# Alembic skeleton. sqlalchemy.url is overridden at runtime by alembic/env.py from
# app.core.config (migrate account via sqlalchemy_migrate_url; DB_MIGRATE_* falls
# back to main account when either is empty). Kept ASCII-only: Windows configparser
# reads .ini with the ANSI codepage (gbk) unless the file is pure ASCII.
[alembic]
script_location = alembic
prepend_sys_path = .

# Placeholder: env.py overrides with settings.sqlalchemy_migrate_url at runtime.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# 前端 Vue3 SPA + API 反代（detail §9；T-1.6 定栈 Vue3+Vite，非 React）。
# 唯一对外入口 = 本 nginx：静态页 + 反代 backend（backend 不暴露宿主端口，P2-D12 同款）。
#
# 反代目标用 container_name `obs-backend` 而非 compose 服务名 `backend`：本仓 compose
# backend 服务即 obs-backend 容器；而 dev 共享 external network（shared-infra_shared-infra）
# 上 customer-service/rag/contract-check/ai-eval 等仓的 backend 服务同样注册 `backend`
# alias（实测 DNS 轮询命中 customer-service-backend → /api 404）。container_name 全局唯一，
# 独立部署网络亦无碍，故以 obs-backend 为反代目标（跨仓现象，S-1 验证发现）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://obs-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /healthz {
        proxy_pass http://obs-backend:8000;
    }

    # 入口 HTML（唯一不带内容哈希的文件）：必须每次回源校验。
    # no-cache ≠ 不缓存 —— 是「可存但每次强制验证」，命中 ETag 返 304，既拿到新 bundle
    # 又省流量；no-store 会让每次导航都完整重下。缺此头时浏览器按
    # (now − Last-Modified) × 10% 启发式自估新鲜期（RFC 7234 §4.2.2），窗口内直接复用
    # 旧索引、连条件请求都不发 → 容器已发新包而浏览器仍跑旧 bundle（D-4 实测现象）。
    #
    # 匹配路径：直接访问 /backflow/clusters/498 走 location / 的 try_files 末项、
    # 访问 / 走 $uri/ + index，两者都是**内部重定向**、会重新做 location 匹配，均命中此处。
    #
    # 注意 nginx add_header 继承规则：location 级一旦出现 add_header，server 级的会整组丢失。
    # 当前 server 级无 add_header 故无影响；日后若要加安全头（X-Frame-Options 等），
    # 必须同时补进下面两个 location，否则会被静默吞掉。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # vite 构建产物文件名含内容哈希（index-DgSjXG-z.js），内容变则名变 → 可长缓存 + immutable
    # （immutable 连 reload 都不再验证，这正是哈希命名的收益）。
    # 前提：assets/ 下**只有**构建产物。将来若把无哈希文件（如 public/ 里的资源）落进该目录，
    # 会被 immutable 永久钉死、改名才能刷掉。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# dev 占位：真实 React SPA + API 反代（detail §9）T-1.6 落地后替换。
# 唯一对外入口 = 本 nginx：静态页 + 反代 backend（backend 不暴露宿主端口，P2-D12 同款）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /healthz {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 前端 Vue3 SPA + API 反代（detail §9；T-1.6 定栈 Vue3+Vite，非 React）。
# 唯一对外入口 = 本 nginx：静态页 + 反代 backend（backend 不暴露宿主端口，P2-D12 同款）。
#
# 反代目标用 container_name `obs-backend` 而非 compose 服务名 `backend`：本仓 compose
# backend 服务即 obs-backend 容器；而 dev 共享 external network（shared-infra_shared-infra）
# 上 customer-service/rag/contract-check/ai-eval 等仓的 backend 服务同样注册 `backend`
# alias（实测 DNS 轮询命中 customer-service-backend → /api 404）。container_name 全局唯一，
# 独立部署网络亦无碍，故以 obs-backend 为反代目标（跨仓现象，S-1 验证发现）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://obs-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /healthz {
        proxy_pass http://obs-backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

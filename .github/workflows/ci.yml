# agent-evaluation-online CI 骨架（T-0.5）。
#
# 同一条流水线对任意代码变更生效；产物不含 compose.infra.dev.yml（非交付物，不进 CI）。
# 三段式：lint+pytest（backend）→ alembic migrate 冒烟（连 CI 临时 MySQL）→ 镜像构建。
# 前端 Vue3+Vite 真构建已随 T-1.6 落地，内嵌于下方「镜像构建」job（frontend/Dockerfile 多阶段：
# npm ci → npm run build = vue-tsc --noEmit 类型检查 + vite build 产 dist 静态镜像）；
# 前端单测（vitest）另设独立 frontend-test job —— 镜像构建只证「能构建」，证不了「用例全绿」。

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖（dev extra 含 ruff/pytest）
        run: pip install -e ".[dev]"
      - name: ruff 静态检查
        run: ruff check app tests alembic
      - name: pytest
        run: pytest -q

  frontend-test:
    name: 前端 vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖（dev 含 vitest/jsdom/@vue/test-utils）
        run: npm ci
      - name: vitest
        run: npm test

  migrate:
    name: alembic migrate 冒烟（临时 MySQL）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: dev.obs
          MYSQL_USER: obs_backend
          MYSQL_PASSWORD: obs_ci_pw
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: alembic upgrade head
        env:
          APP_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: root
        run: alembic upgrade head

  images:
    name: 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建 backend 镜像
        run: docker build -f backend/docker/Dockerfile -t obs-backend:ci backend
      - name: 构建 frontend 镜像（Vue3+Vite 多阶段）
        run: docker build -t obs-frontend:ci frontend
